
name: Sincronizar GAMING PRO com CENTRAL ADM

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: gaming-central-sync
  cancel-in-progress: false

jobs:
  sincronizar:
    name: Sincronizar Gaming Pro
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Firebase Admin
        run: npm install --no-save firebase-admin@13

      - name: Sincronizar Gaming Pro
        env:
          FIREBASE_GAMING_ADMIN: ${{ secrets.FIREBASE_GAMING_ADMIN }}
          FIREBASE_CENTRAL_ADMIN: ${{ secrets.FIREBASE_CENTRAL_ADMIN }}
        run: node scripts/sincronizar-central.cjs
